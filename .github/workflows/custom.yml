name: Auto Release Notes

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Release Notes
        run: |
          echo "Release notes generated at $(date)" > release.log

      - name: Upload release notes
        uses: actions/upload-artifact@v3
        with:
          name: release-notes
          path: release.log
