name: Dependency Update CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test-updates:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: npm test || echo "No tests"
